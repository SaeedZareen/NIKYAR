# نصب کامل نیک‌یار روی سرور سازمان:
#   1) فایل .env را از روی .env.example بسازید و رمزها را تغییر دهید
#   2) docker compose up -d --build
#   3) docker compose exec app python manage.py createsuperuser
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nikyar
      POSTGRES_USER: nikyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?رمز پایگاه داده را در فایل .env تعیین کنید}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${NIKYAR_PORT:-8080}:8000"
    environment:
      POSTGRES_DB: nikyar
      POSTGRES_USER: nikyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      NIKYAR_SECRET_KEY: ${NIKYAR_SECRET_KEY:?کلید امنیتی را در فایل .env تعیین کنید}
      NIKYAR_ALLOWED_HOSTS: ${NIKYAR_ALLOWED_HOSTS:-*}
      NIKYAR_CSRF_ORIGINS: ${NIKYAR_CSRF_ORIGINS:-}
      NIKYAR_LICENSE_FILE: /app/license/license.json
    volumes:
      - ./license:/app/license:ro

volumes:
  pgdata:
